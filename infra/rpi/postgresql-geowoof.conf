# PostgreSQL for a Raspberry Pi 3 with about 900 MiB shared with the API, Redis, SeaweedFS and Caddy.
listen_addresses = 'localhost'
max_connections = 40
shared_buffers = 64MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
# A microSD: fewer writes, without giving up durability (synchronous_commit stays on).
checkpoint_timeout = 15min
max_wal_size = 256MB
min_wal_size = 64MB
random_page_cost = 2.0
effective_io_concurrency = 1
max_worker_processes = 4
max_parallel_workers_per_gather = 1
log_min_duration_statement = 1000
log_checkpoints = off
